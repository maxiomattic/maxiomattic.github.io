<svg class="orrery" xmlns="http://www.w3.org/2000/svg" viewBox="-400 -400 800 800" aria-hidden="true" focusable="false">
<style>
.orrery .g0{stop-color:#D9B26A;stop-opacity:.35}
.orrery .g1{stop-color:#D9B26A;stop-opacity:0}
.orrery .grat *{fill:none;stroke:#22336B;stroke-width:.6;vector-effect:non-scaling-stroke}
.orrery .grat circle{stroke-dasharray:2 6}
.orrery .disc{fill:#D9B26A}
.orrery .ring{fill:none;stroke:#D9B26A;stroke-width:1.2}
.orrery .rays{fill:none;stroke:#D9B26A;stroke-width:1.4;stroke-linecap:round}
.orrery .orbit{fill:none;stroke:#8E7444;stroke-width:1;vector-effect:non-scaling-stroke}
.orrery .dashed{stroke-dasharray:1 5}
.orrery .comet{fill:none;stroke:#8FDCEB;stroke-width:1.2;stroke-linecap:round;opacity:.7}
.orrery .body{fill:#E9ECF5}
.orrery .ion{fill:none;stroke:#8FDCEB;stroke-width:1;vector-effect:non-scaling-stroke}
.orrery .bez{fill:none;stroke:#D9B26A;stroke-width:1;vector-effect:non-scaling-stroke}
.orrery .mk{fill:none;stroke:#8E7444;stroke-width:1;vector-effect:non-scaling-stroke}
.orrery .mj{fill:none;stroke:#D9B26A;stroke-width:1;vector-effect:non-scaling-stroke}
.orrery text{font-family:"Martian Mono", ui-monospace, monospace}
.orrery .lbl{fill:#96A0C3;font-size:11px;stroke:#060A1C;stroke-width:3;paint-order:stroke}
.orrery .tk{fill:#96A0C3;font-size:9px;stroke:#060A1C;stroke-width:3;paint-order:stroke}
@media (prefers-reduced-motion: no-preference){
@keyframes orrery-pulse{0%,100%{opacity:.8}50%{opacity:1}}
.orrery .glow{animation:orrery-pulse 6s ease-in-out infinite}
}
</style>
<defs><radialGradient id="orr-glow" cx="0" cy="0" r="170" gradientUnits="userSpaceOnUse"><stop class="g0" offset="0"/><stop class="g1" offset="1"/></radialGradient></defs>
<circle class="glow" r="170" fill="url(#orr-glow)"/>
