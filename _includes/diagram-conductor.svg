<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img">
<title>Audio comes in, the model detects which section is playing, and the animated conductor cues it.</title>
<style>
.diagram text{font-family:"Martian Mono", ui-monospace, monospace;font-size:12px}
.diagram .cd-wave{fill:none;stroke:#8FDCEB;stroke-width:1.2;stroke-linejoin:round}
.diagram .cd-lbl{fill:#96A0C3}
.diagram .cd-hilbl{fill:#D9B26A}
.diagram .cd-t{fill:#E9ECF5}
.diagram .cd-node{fill:#0C1433;stroke:#D9B26A;stroke-width:1.2}
.diagram .cd-link{fill:none;stroke:#8E7444;stroke-width:1.2}
.diagram .cd-head{fill:#8E7444}
.diagram .cd-sec{fill:#0C1433;stroke:#22336B;stroke-width:1.2}
.diagram .cd-hi{fill:#D9B26A;stroke:#D9B26A;stroke-width:1.2}
.diagram .cd-star{fill:#E9ECF5}
.diagram .cd-baton{fill:none;stroke:#E9ECF5;stroke-width:1;stroke-dasharray:3 3}
@media (prefers-reduced-motion: no-preference){
@keyframes cd-cue{to{stroke-dashoffset:-6}}
.diagram .cd-baton{animation:cd-cue 1.6s linear infinite}
}
</style>
