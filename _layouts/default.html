<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <meta name="theme-color" content="#060a1c">
  <meta name="color-scheme" content="dark">
  <link rel="preload" href="{{ '/assets/fonts/michroma.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/jost.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/martian-mono.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  {% feed_meta %}
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_html | strip_newlines }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
</head>
<body class="{{ page.body_class | default: 'inner-page' }}">
  <a class="skip" href="#content">Skip to content</a>
  <div class="sky" aria-hidden="true">{% include starfield.svg %}</div>
  {% include masthead.html %}
  {{ content }}
  <footer class="colophon">
    {% include meander.svg %}
    <div class="colophon-inner">
      <div class="contact">
        <h2 class="contact-title">Say hello</h2>
        <a class="contact-mail" href="{{ site.links.email }}">{{ site.author.email }}</a>
      </div>
      <nav class="contact-links" aria-label="Elsewhere">
        <a href="{{ site.links.linkedin }}">LinkedIn</a>
        <a href="{{ site.links.github }}">GitHub</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
      <p class="signoff">&copy; {{ site.time | date: '%Y' }} Noah Hamm</p>
    </div>
  </footer>
  <script>
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('svg').forEach(function (s) { if (s.pauseAnimations) s.pauseAnimations(); });
    }
  </script>
</body>
</html>
